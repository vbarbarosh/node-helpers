<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>@vbarbarosh/node-helpers</title>
    <link href="https://unpkg.com/@vbarbarosh/smcss@1.2.0/dist/sm.css" rel="stylesheet">
    <link href="css/default.css" rel="stylesheet">
    <script>
    // Apply theme before first paint to avoid flashing
    document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
</head>
<body>

<script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
<script>
// The ui-helpers bundle below adds a script tag for an Axios of its own, and
// that later script would replace the one pinned above. While the bundle runs,
// a tag for any Axios is pointed at the pinned file, so the page loads and
// runs one version only (bin/check-docs-page.js checks it in a browser).
(function () {
    const pinned = document.querySelector('script[src*="/axios@"]').src;
    const insert = Element.prototype.insertAdjacentElement;
    Element.prototype.insertAdjacentElement = function (where, elem) {
        if (elem instanceof HTMLScriptElement && /\/axios@[^/]+\/dist\/axios(\.min)?\.js$/.test(elem.src)) {
            elem.src = pinned;
        }
        return insert.call(this, where, elem);
    };
    window.axios_pin_release = function () {
        Element.prototype.insertAdjacentElement = insert;
        delete window.axios_pin_release;
    };
})();
</script>
<script src="https://unpkg.com/@vbarbarosh/ui-helpers@0.4.0/src/static/js/bundle.js"></script>
<script>axios_pin_release();</script>
<script src="js/browser.js?v=3.79.2&var=h"></script>
<script src="js/components/main-demos.js?v=3.79.2"></script>
<script src="js/components/main-header.js?v=3.79.2"></script>
<script src="js/components/main-helpers.js?v=3.79.2"></script>
<script>
vue_component('app', {
    template: `
        <div v-if="ready" class="fix-f hsplit">
            <main class="fluid oa">
                <main-header />
                <main-helpers :items="items.src" :items_hit="items_hit" />
                <main-demos :items="items.demos" :items_hit="items_hit" />
                <div style="height:50vh;" />
            </main>
            <aside class="vsplit w300">
                <div class="controls">
                    <input-search ref="search" v-model="search" />
                    <button class="theme-toggle" v-bind:title="(theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme')" v-on:click="click_theme">{{ theme === 'dark' ? '☀️' : '🌙' }}</button>
                </div>
                <ul class="fluid oa">
                    <li v-for="item in items_all" v-bind:key="item.file" v-show="items_hit.has(item)" v-on:click="click_item_search(item)">
                        {{ item.file.replace(/^src\\//, '') }}
                    </li>
                </ul>
            </aside>
        </div>
`,
    data: function () {
        return {
            ready: false,
            search: '',
            items: null,
            theme: document.documentElement.dataset.theme,
        };
    },
    computed: {
        // All available items
        items_all: function () {
            return [...this.items.src, ...this.items.demos];
        },
        // Items hit by filter
        items_hit: function () {
            const filter = h.filter1_from_spec(this.search);
            return new Set(this.items_all.filter(v => filter(v.file)));
        },
    },
    methods: {
        refresh: async function () {
            this.items = await http_get_json('data.json');
            this.items.demos.sort((a,b) => a.file.localeCompare(b.file));
        },
        click_item_search: function (item) {
           window.location.replace(`#${item.id}`);
        },
        click_theme: function () {
            this.theme = (this.theme === 'dark') ? 'light' : 'dark';
            document.documentElement.dataset.theme = this.theme;
            localStorage.setItem('theme', this.theme);
        },
    },
    created: async function () {
        await blocking(this.refresh());
        this.ready = true;
        await this.$nextTick();
        if (window.location.hash) {
            window.location.replace(window.location.hash);
        }
    },
    mounted: function () {
        const _this = this;
        document.addEventListener('keydown', function (event) {
            if (event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }
            if (event.key === 'Escape') {
                _this.$refs.search.$el.blur();
                if (_this.$refs.search.$el.value) {
                    _this.$refs.search.$el.value = '';
                    _this.$refs.search.$el.dispatchEvent(new Event('input', {bubbles: true}));
                }
                return;
            }
            if (document.activeElement.tagName === 'INPUT') {
                return;
            }
            if (document.activeElement === _this.$refs.search.$el) {
                return;
            }
            _this.$refs.search.$el.focus();
            _this.$refs.search.$el.select();
        });
    },
});
</script>

</body>
</html>
